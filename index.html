<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartSpend - Expense Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 28px 28px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      opacity: 0.85;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .balance {
      background: white;
      margin-top: -35px;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .balance h2 {
      font-size: 14px;
      color: #6b7280;
    }

    .balance .amount {
      font-size: 32px;
      font-weight: bold;
      margin: 8px 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .card span {
      color: #6b7280;
      font-size: 13px;
    }

    .card h3 {
      margin-top: 8px;
      font-size: 20px;
    }

    .income {
      color: #16a34a;
    }

    .expense {
      color: #dc2626;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-top: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .section h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 15px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .transaction:last-child {
      border-bottom: none;
    }

    .transaction-title {
      font-weight: bold;
    }

    .transaction-date {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

      background: #fee2e2;
